name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 16.4 with Swift 6
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test
        run: make test
      - name: Build DMG
        env:
          TAG: ${{ github.ref_name }}
        run: make version="${TAG#v}" arch=arm64 dmg
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/*.dmg
            dist/*.sha256

  legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: legacy/go.sum
      - name: Install Linux tray dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Test and build legacy targets
        working-directory: legacy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go test ./...
          make version="${TAG#v}" build-win build-linux
          mkdir -p dist
          cp ../LICENSE bin/windows/LICENSE
          cp ../LICENSE bin/linux/LICENSE
          (cd bin/windows && zip ../../dist/github-notify_${TAG#v}_windows_amd64.zip github-notify.exe LICENSE)
          tar -czf "dist/github-notify_${TAG#v}_linux_amd64.tar.gz" -C bin/linux github-notify LICENSE
          (cd dist && sha256sum *.zip *.tar.gz > legacy.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: release-legacy
          path: legacy/dist

  publish:
    needs: [macos, legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --title "$TAG" --notes "Native Apple Silicon build for macOS 13 or later. Windows and Linux use the legacy Go app. The macOS build is ad-hoc signed, not Developer ID signed or notarized."
